[package]
name = "ttyr"
version = "0.1.0"
authors = ["mxaddict <mxaddict@kryptic.sh>"]
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Terminal input, output and raw mode for Rust, with the full kitty keyboard protocol and a ratatui backend"
repository = "https://github.com/kryptic-sh/ttyr"
homepage = "https://github.com/kryptic-sh/ttyr"
readme = "README.md"
keywords = ["terminal", "tty", "kitty", "keyboard", "tui"]
categories = ["command-line-interface"]

[dependencies]
bitflags = "2.13.2"
serde = { version = "1.0.229", features = ["derive"], optional = true }

[lints.clippy]
or_fun_call = "deny"
unused_peekable = "deny"
assigning_clones = "warn"
format_push_string = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
use_self = "warn"
redundant_pub_crate = "warn"

[features]
serde = ["dep:serde", "bitflags/serde"]

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.6", features = ["termios", "event", "fs"] }
signal-hook = { version = "0.4.6", default-features = false }

[target."cfg(unix)".dev-dependencies]
rustix = { version = "1.1.6", features = ["pty", "termios"] }
