[package]
name = "ttyr"
version = "0.2.0"
authors = ["mxaddict <mxaddict@kryptic.sh>"]
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Terminal input, output and raw mode for Rust, with the full kitty keyboard protocol and a ratatui backend"
repository = "https://github.com/kryptic-sh/ttyr"
readme = "README.md"
keywords = ["terminal", "tty", "kitty", "keyboard", "tui"]
categories = ["command-line-interface"]

[dependencies]
bitflags = "2.13.2"
ratatui-core = { version = "0.1.2", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }

[lints.clippy]
or_fun_call = "deny"
unused_peekable = "deny"
assigning_clones = "warn"
format_push_string = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
use_self = "warn"
redundant_pub_crate = "warn"

[features]
serde = ["dep:serde", "bitflags/serde"]
ratatui = ["dep:ratatui-core", "ratatui-core/underline-color"]

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.6", features = ["termios", "event", "fs"] }
signal-hook = { version = "0.4.6", default-features = false }

[target."cfg(unix)".dev-dependencies]
rustix = { version = "1.1.6", features = ["process", "pty", "termios"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_Security", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
ratatui-crossterm = { version = "0.1.2", features = ["unstable-backend-writer"] }
